services:
  # ----------------------------------------
  # 1. The Backend (Django)
  # ----------------------------------------
  - type: web
    name: django-backend
    env: python
    region: singapore # Matches your previous screenshot
    # Make sure you change 'project_name' below to your actual Django folder name!
    startCommand: "gunicorn project_name.wsgi:application"
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    branch: main

  # ----------------------------------------
  # 2. The Frontend (Next.js)
  # ----------------------------------------
  - type: web
    name: nextjs-frontend
    env: node
    region: singapore
    startCommand: "npm start"
    buildCommand: "npm install && npm run build"
    branch: main
